[project]
name = "shorts-factory-backend"
version = "0.1.0"
description = "Automated YouTube Shorts generation and publishing service"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "asyncpg>=0.30.0",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Settings
    "pydantic-settings>=2.6.0",
    "pydantic>=2.10.0",

    # AI / APIs
    "anthropic>=0.40.0",
    "elevenlabs>=1.9.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",

    # YouTube
    "google-api-python-client>=2.154.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",

    # Media processing
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=1.1.0",

    # Encryption
    "cryptography>=43.0.0",

    # Logging
    "structlog>=24.4.0",

    # Metrics
    "prometheus-client>=0.21.0",

    # Utils
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.1",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "workers", "models", "db", "utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
